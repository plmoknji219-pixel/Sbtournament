<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel - SB Tournament</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080d1c;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111a35;
      padding: 18px;
      text-align: center;
      border-bottom: 2px solid #00e5ff;
    }

    header h1 {
      color: #00e5ff;
      font-size: 26px;
    }

    header p {
      color: #aaa;
      margin-top: 6px;
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .top-bar h2 {
      color: #fff;
    }

    .refresh-btn {
      border: none;
      background: #00e5ff;
      color: #001018;
      padding: 11px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .refresh-btn:hover {
      opacity: 0.85;
    }

    .status {
      background: #10182d;
      border: 1px solid #26345a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      color: #aaa;
      font-size: 14px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      background: #111a35;
      border: 1px solid #26345a;
      border-radius: 12px;
      padding: 22px;
      text-align: center;
    }

    .card h3 {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .number {
      font-size: 34px;
      font-weight: bold;
      color: #00e5ff;
    }

    .links {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .links a {
      text-decoration: none;
      text-align: center;
      background: #111a35;
      border: 1px solid #26345a;
      color: white;
      padding: 14px;
      border-radius: 8px;
    }

    .links a:hover {
      border-color: #00e5ff;
      color: #00e5ff;
    }

    .footer {
      text-align: center;
      color: #777;
      padding: 35px 10px;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .dashboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .links {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .links {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>SB TOURNAMENT</h1>
  <p>Admin Control Panel</p>
</header>

<div class="container">

  <div class="top-bar">
    <h2>Dashboard</h2>
    <button class="refresh-btn" onclick="loadDashboard()">
      🔄 Refresh
    </button>
  </div>

  <div class="status" id="status">
    Connecting to Supabase...
  </div>

  <div class="dashboard">

    <div class="card">
      <h3>Players</h3>
      <div class="number" id="playersCount">0</div>
    </div>

    <div class="card">
      <h3>Payments</h3>
      <div class="number" id="paymentsCount">0</div>
    </div>

    <div class="card">
      <h3>Matches</h3>
      <div class="number" id="matchesCount">0</div>
    </div>

    <div class="card">
      <h3>Tournaments</h3>
      <div class="number" id="tournamentsCount">0</div>
    </div>

  </div>

  <div class="links">

    <a href="index.html">🏠 Home</a>

    <a href="tournament.html">🏆 Tournaments</a>

    <a href="registration.html">📝 Registration</a>

    <a href="player-dashboard.html">👤 Player Dashboard</a>

    <a href="leaderboard.html">🥇 Leaderboard</a>

    <a href="payment.html">💳 Payments</a>

    <a href="match-management.html">🎮 Match Management</a>

    <a href="match-history.html">📜 Match History</a>

    <a href="about.html">ℹ️ About</a>

  </div>

</div>

<div class="footer">
  © 2026 SB Tournament — Admin Panel
</div>


<script>

  /* ==============================
     SUPABASE CONFIG
  ============================== */

  const SUPABASE_URL =
    "https://nbpajmpaoaipithpoocj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_NpG4P_VRdesJJkkzuBoanw_mbM3ivFS";


  /* ==============================
     TABLE NAMES
  ============================== */

  const TABLES = {
    players: "players",
    payments: "payments",
    matches: "matches",
    tournaments: "tournaments"
  };


  /* ==============================
     SUPABASE COUNT FUNCTION
  ============================== */

  async function getCount(tableName) {

    try {

      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/${tableName}?select=*`,
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Prefer": "count=exact"
          }
        }
      );

      if (!response.ok) {
        return 0;
      }

      const contentRange =
        response.headers.get("content-range");

      if (contentRange) {

        const total =
          contentRange.split("/")[1];

        if (total && total !== "*") {
          return parseInt(total);
        }
      }

      const data = await response.json();

      return Array.isArray(data)
        ? data.length
        : 0;

    } catch (error) {

      console.log(
        `Table ${tableName} error:`,
        error
      );

      return 0;
    }
  }


  /* ==============================
     LOAD DASHBOARD
  ============================== */

  async function loadDashboard() {

    const status =
      document.getElementById("status");

    status.innerText =
      "⏳ Loading data from Supabase...";


    document.getElementById("playersCount")
      .innerText = "...";

    document.getElementById("paymentsCount")
      .innerText = "...";

    document.getElementById("matchesCount")
      .innerText = "...";

    document.getElementById("tournamentsCount")
      .innerText = "...";


    const [
      players,
      payments,
      matches,
      tournaments
    ] = await Promise.all([

      getCount(TABLES.players),

      getCount(TABLES.payments),

      getCount(TABLES.matches),

      getCount(TABLES.tournaments)

    ]);


    document.getElementById("playersCount")
      .innerText = players;

    document.getElementById("paymentsCount")
      .innerText = payments;

    document.getElementById("matchesCount")
      .innerText = matches;

    document.getElementById("tournamentsCount")
      .innerText = tournaments;


    status.innerText =
      "✅ Supabase connected. Dashboard updated.";
  }


  /* ==============================
     START
  ============================== */

  loadDashboard();

</script>

</body>
      </html>
