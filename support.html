<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SB Tournament - Support</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #1e3a8a, #4c1d95);
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 30px auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #dbeafe;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.95);
            color: #111827;
            font-size: 15px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            box-shadow: 0 0 0 3px rgba(96,165,250,0.5);
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            min-height: 20px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #bfdbfe;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #cbd5e1;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>🎧 Support</h1>

        <p class="subtitle">
            Need help? Submit your support request below.
        </p>

        <form id="supportForm">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="gameId">Game UID</label>
            <input
                type="text"
                id="gameId"
                placeholder="Enter your Game UID"
                required
            >

            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                placeholder="What do you need help with?"
                required
            >

            <label for="problem">Problem</label>
            <textarea
                id="problem"
                placeholder="Describe your problem..."
                required
            ></textarea>

            <button type="submit" id="submitBtn">
                Submit Support Request
            </button>

        </form>

        <div id="message"></div>

        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>

    <div class="footer">
        © 2026 SB Tournament. All rights reserved.
    </div>

</div>

<script>
const SUPABASE_URL = "https://ofcpuiubovcjxucqynyw.supabase.co";
const SUPABASE_KEY = "sb_publishable_NpG4P_VRdesJJkkzuBoanw_mbM3ivFS";

const form = document.getElementById("supportForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async function (event) {

    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const gameId = document.getElementById("gameId").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const problem = document.getElementById("problem").value.trim();

    if (!name || !gameId || !subject || !problem) {
        message.textContent = "Please fill in all fields.";
        return;
    }

    message.textContent = "Sending...";
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/support`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Prefer": "return=minimal"
                },

                body: JSON.stringify({
                    name: name,
                    game_uid: gameId,
                    subject: subject,
                    problem: problem,
                    status: "pending"
                })
            }
        );

        if (!response.ok) {

            const errorText = await response.text();

            console.error("Supabase Error:", errorText);

            throw new Error(errorText);
        }

        message.textContent =
            "✅ Support request submitted successfully!";

        form.reset();

    } catch (error) {

        console.error("Support request error:", error);

        message.textContent =
            "❌ Failed to submit request. Please try again.";

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Support Request";
    }

});
</script>

</body>
              </html>
