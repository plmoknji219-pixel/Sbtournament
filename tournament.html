<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SB Tournament</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080d1c;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: #111a35;
      padding: 18px 15px;
      text-align: center;
      border-bottom: 2px solid #00e5ff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      color: #00e5ff;
      font-size: 25px;
    }

    .container {
      width: 94%;
      max-width: 700px;
      margin: 20px auto;
    }

    .status {
      text-align: center;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      background: #111a35;
      color: #aaa;
    }

    .error {
      color: #ff6b6b;
      border: 1px solid #ff4444;
    }

    .empty {
      color: #ffd166;
    }

    .tournament-card {
      background: #111a35;
      border: 1px solid #26345f;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    .tournament-card h2 {
      color: #00e5ff;
      margin-bottom: 12px;
      font-size: 21px;
    }

    .info {
      display: grid;
      gap: 8px;
      margin-bottom: 15px;
    }

    .info div {
      color: #ddd;
      font-size: 14px;
    }

    .label {
      color: #00e5ff;
      font-weight: bold;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      background: #173d2d;
      color: #54ff9a;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .join-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      background: #00e5ff;
      color: #061018;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .join-btn:active {
      transform: scale(.98);
    }

    .refresh-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #00e5ff;
      border-radius: 9px;
      background: transparent;
      color: #00e5ff;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px 10px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>SB TOURNAMENT</h1>
</header>

<div class="container">

  <button class="refresh-btn" onclick="loadTournaments()">
    🔄 Refresh Tournaments
  </button>

  <div id="status" class="status">
    Loading tournaments...
  </div>

  <div id="tournamentList"></div>

</div>

<footer>
  © 2026 SB Tournament
</footer>

<script>
  // ==============================
  // SUPABASE CONFIGURATION
  // ==============================

  const SUPABASE_URL =
    "https://ofcpuiubovcjxucqynyw.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_NpG4P_VRdesJJkkzuBoanw_mbM3ivFS";


  // ==============================
  // LOAD TOURNAMENTS
  // ==============================

  async function loadTournaments() {

    const status = document.getElementById("status");
    const list = document.getElementById("tournamentList");

    status.className = "status";
    status.textContent = "Loading tournaments...";
    list.innerHTML = "";

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/tournament?select=*&order=id.desc"
        {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY,
            "Content-Type": "application/json"
          }
        }
      );

      if (!response.ok) {

        let errorMessage = "Unable to load tournaments.";

        try {
          const errorData = await response.json();

          if (errorData.message) {
            errorMessage = errorData.message;
          } else if (errorData.hint) {
            errorMessage = errorData.hint;
          }
        } catch (e) {}

        throw new Error(
          errorMessage + " (HTTP " + response.status + ")"
        );
      }

      const tournaments = await response.json();

      if (!Array.isArray(tournaments)) {
        throw new Error("Invalid tournament data received.");
      }

      if (tournaments.length === 0) {

        status.className = "status empty";
        status.textContent = "No tournaments available right now.";

        return;
      }

      status.style.display = "none";

      tournaments.forEach(function(tournament) {

        const card = document.createElement("div");
        card.className = "tournament-card";

        const title =
          tournament.title ||
          tournament.name ||
          "SB Tournament";

        const game =
          tournament.game ||
          "Free Fire";

        const entry =
          tournament.entry_fee ??
          tournament.entry ??
          "0";

        const prize =
          tournament.prize ??
          tournament.prize_pool ??
          "Not specified";

        const date =
          tournament.date ||
          "Not specified";

        const time =
          tournament.time ||
          "Not specified";

        const roomId =
          tournament.room_id ||
          "Not available";

        const roomPassword =
          tournament.room_password ||
          "Not available";

        const tournamentStatus =
          tournament.status ||
          "Open";

        card.innerHTML = `
          <h2>${escapeHTML(title)}</h2>

          <span class="status-badge">
            ${escapeHTML(tournamentStatus)}
          </span>

          <div class="info">

            <div>
              <span class="label">🎮 Game:</span>
              ${escapeHTML(game)}
            </div>

            <div>
              <span class="label">💰 Entry Fee:</span>
              ৳${escapeHTML(String(entry))}
            </div>

            <div>
              <span class="label">🏆 Prize:</span>
              ৳${escapeHTML(String(prize))}
            </div>

            <div>
              <span class="label">📅 Date:</span>
              ${escapeHTML(String(date))}
            </div>

            <div>
              <span class="label">⏰ Time:</span>
              ${escapeHTML(String(time))}
            </div>

            <div>
              <span class="label">🔐 Room ID:</span>
              ${escapeHTML(String(roomId))}
            </div>

            <div>
              <span class="label">🔑 Password:</span>
              ${escapeHTML(String(roomPassword))}
            </div>

          </div>

          <button
            class="join-btn"
            onclick="joinTournament('${escapeJS(String(tournament.id || ""))}')"
          >
            JOIN TOURNAMENT
          </button>
        `;

        list.appendChild(card);
      });

    } catch (error) {

      console.error("Supabase Error:", error);

      status.style.display = "block";
      status.className = "status error";

      status.innerHTML =
        "❌ Failed to load tournaments.<br><br>" +
        escapeHTML(error.message) +
        "<br><br>" +
        "Please check your Supabase table and RLS policy.";

    }
  }


  // ==============================
  // JOIN TOURNAMENT
  // ==============================

  function joinTournament(id) {

    if (!id) {
      alert("Tournament ID not found.");
      return;
    }

    // Registration page
    window.location.href =
      "registration.html?tournament_id=" +
      encodeURIComponent(id);
  }


  // ==============================
  // SECURITY HELPERS
  // ==============================

  function escapeHTML(value) {

    return value
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeJS(value) {

    return value
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");
  }


  // ==============================
  // START
  // ==============================

  loadTournaments();

</script>

</body>
      </html>
