<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SB Tournament</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080d1c;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: #111a35;
      padding: 18px 20px;
      text-align: center;
      border-bottom: 2px solid #00e5ff;
    }

    header h1 {
      color: #00e5ff;
      font-size: 25px;
    }

    .container {
      width: 94%;
      max-width: 900px;
      margin: 25px auto;
    }

    .page-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .page-title h2 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .page-title p {
      color: #aab4d0;
      font-size: 14px;
    }

    #message {
      display: none;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.5;
    }

    .loading {
      display: block !important;
      background: #111a35;
      color: #00e5ff;
    }

    .error {
      display: block !important;
      background: #35151b;
      border: 1px solid #ff4757;
      color: #ffb3ba;
    }

    .success-empty {
      display: block !important;
      background: #111a35;
      color: #aab4d0;
    }

    .retry-btn {
      border: none;
      background: #00e5ff;
      color: #001016;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    #tournamentList {
      display: grid;
      gap: 18px;
    }

    .tournament-card {
      background: #111a35;
      border: 1px solid #24335c;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .tournament-card h3 {
      color: #00e5ff;
      font-size: 21px;
      margin-bottom: 12px;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }

    .info div {
      background: #0b1227;
      padding: 10px;
      border-radius: 9px;
      color: #dce4ff;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
      background: #163b28;
      color: #63ff9a;
    }

    .join-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #00e5ff, #008cff);
      color: #001016;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .join-btn:active {
      transform: scale(0.98);
    }

    .closed-btn {
      background: #333b52;
      color: #aeb6ca;
      cursor: not-allowed;
    }

    .debug {
      margin-top: 12px;
      font-size: 12px;
      color: #ff9da8;
      word-break: break-word;
    }

    @media (max-width: 600px) {
      .container {
        width: 92%;
      }

      .info {
        grid-template-columns: 1fr;
      }

      .tournament-card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>SB TOURNAMENT</h1>
  </header>

  <main class="container">

    <div class="page-title">
      <h2>Available Tournaments</h2>
      <p>Choose a tournament and join your match.</p>
    </div>

    <div id="message"></div>

    <div id="tournamentList"></div>

  </main>

  <script>
    /* =========================================
       SUPABASE CONFIG
    ========================================= */

    const SUPABASE_URL =
      "https://ofcpuiubovcjxucqynyw.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_NpG4P_VRdesJJkkzuBoanw_mbM3ivFS";

    let supabaseClient;

    try {
      if (!window.supabase) {
        throw new Error("Supabase library did not load.");
      }

      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    } catch (error) {
      showError(
        "Supabase connection could not be initialized.",
        error
      );
    }


    /* =========================================
       HELPERS
    ========================================= */

    function showMessage(text, type = "") {
      const message = document.getElementById("message");

      message.className = "";
      message.id = "message";

      if (type) {
        message.classList.add(type);
      }

      message.innerHTML = text;
    }


    function hideMessage() {
      const message = document.getElementById("message");
      message.style.display = "none";
      message.innerHTML = "";
    }


    function showLoading() {
      showMessage(
        "⏳ Loading tournaments...",
        "loading"
      );
    }


    function showError(message, error = null) {

      let details = "";

      if (error) {
        details =
          `<div class="debug">
            Error: ${escapeHTML(error.message || String(error))}
          </div>`;
      }

      showMessage(
        `❌ <strong>${escapeHTML(message)}</strong>
         ${details}
         <br>
         <button class="retry-btn" onclick="loadTournaments()">
           Retry
         </button>`,
        "error"
      );
    }


    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function value(obj, keys, fallback = "N/A") {

      for (const key of keys) {

        if (
          obj &&
          obj[key] !== undefined &&
          obj[key] !== null &&
          obj[key] !== ""
        ) {
          return obj[key];
        }

      }

      return fallback;
    }


    /* =========================================
       LOAD TOURNAMENTS
    ========================================= */

    async function loadTournaments() {

      const list =
        document.getElementById("tournamentList");

      list.innerHTML = "";

      showLoading();

      if (!supabaseClient) {
        showError(
          "Supabase is not connected."
        );
        return;
      }

      try {

        /*
          We first try the normal query.
        */

        const { data, error } =
          await supabaseClient
            .from("tournaments")
            .select("*")
            .order("id", { ascending: false });

        if (error) {
          throw error;
        }


        /* =====================================
           EMPTY RESULT
        ===================================== */

        if (!data || data.length === 0) {

          showMessage(
            `ℹ️ No tournaments found yet.
             <br>
             Create a tournament in your
             <strong>tournaments</strong> table.`,
            "success-empty"
          );

          return;
        }


        hideMessage();


        /* =====================================
           CREATE CARDS
        ===================================== */

        data.forEach(tournament => {

          const id =
            value(
              tournament,
              ["id", "tournament_id"]
            );

          const name =
            value(
              tournament,
              ["name", "title", "tournament_name"],
              "Unnamed Tournament"
            );

          const entry =
            value(
              tournament,
              ["entry_fee", "entry", "entryFee"],
              "0"
            );

          const prize =
            value(
              tournament,
              ["prize_pool", "prize", "prize_pool_amount"],
              "0"
            );

          const players =
            value(
              tournament,
              ["max_players", "players", "player_limit"],
              "N/A"
            );

          const mode =
            value(
              tournament,
              ["mode", "game_mode"],
              "Free Fire"
            );

          const status =
            value(
              tournament,
              ["status"],
              "open"
            );


          const safeStatus =
            String(status).toLowerCase();


          const isOpen =
            safeStatus === "open" ||
            safeStatus === "active" ||
            safeStatus === "available";


          const card =
            document.createElement("div");

          card.className =
            "tournament-card";


          card.innerHTML = `

            <span class="status">
              ${escapeHTML(status)}
            </span>

            <h3>
              ${escapeHTML(name)}
            </h3>

            <div class="info">

              <div>
                🎮 Mode:
                <strong>
                  ${escapeHTML(mode)}
                </strong>
              </div>

              <div>
                💰 Entry:
                <strong>
                  ৳${escapeHTML(entry)}
                </strong>
              </div>

              <div>
                🏆 Prize:
                <strong>
                  ৳${escapeHTML(prize)}
                </strong>
              </div>

              <div>
                👥 Players:
                <strong>
                  ${escapeHTML(players)}
                </strong>
              </div>

            </div>

            ${
              isOpen

              ? `
                <button
                  class="join-btn"
                  onclick="joinTournament('${escapeHTML(id)}')">
                  JOIN TOURNAMENT
                </button>
              `

              : `
                <button
                  class="join-btn closed-btn"
                  disabled>
                  TOURNAMENT CLOSED
                </button>
              `
            }

          `;


          list.appendChild(card);

        });

      } catch (error) {

        console.error(
          "Tournament load error:",
          error
        );

        showError(
          "Tournament load failed.",
          error
        );

      }

    }


    /* =========================================
       JOIN TOURNAMENT
    ========================================= */

    function joinTournament(id) {

      if (!id || id === "N/A") {

        alert(
          "Tournament ID is missing."
        );

        return;
      }

      window.location.href =
        "registration.html?tournament_id=" +
        encodeURIComponent(id);

    }


    /* =========================================
       START
    ========================================= */

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        loadTournaments();

      }
    );

  </script>

</body>
  </html>
