<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tournaments - SB Tournament</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:#fff;
    min-height:100vh;
}

header{
    background:#111827;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#38bdf8;
}

.menu-btn{
    display:none;
    font-size:26px;
    cursor:pointer;
}

nav{
    display:flex;
    gap:18px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:15px;
}

nav a:hover{
    color:#38bdf8;
}

.container{
    max-width:1100px;
    margin:40px auto;
    padding:20px;
}

.page-title{
    text-align:center;
    margin-bottom:10px;
    color:#38bdf8;
    font-size:32px;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

.tournament-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.tournament-card{
    background:#1e293b;
    border-radius:16px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    border:1px solid #334155;
    transition:.2s;
}

.tournament-card:hover{
    transform:translateY(-4px);
    border-color:#38bdf8;
}

.icon{
    font-size:45px;
    text-align:center;
    margin-bottom:15px;
}

.tournament-card h2{
    text-align:center;
    color:#f8fafc;
    margin-bottom:18px;
}

.info{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #334155;
    color:#cbd5e1;
}

.info strong{
    color:#fff;
}

.status{
    text-align:center;
    margin:18px 0;
    padding:8px;
    border-radius:7px;
    background:#166534;
    color:#bbf7d0;
    font-weight:bold;
}

.status.closed{
    background:#7f1d1d;
    color:#fecaca;
}

.join-btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    padding:13px;
    background:#0284c7;
    color:#fff;
    border-radius:8px;
    font-weight:bold;
    border:none;
    cursor:pointer;
}

.join-btn:hover{
    background:#0369a1;
}

.join-btn.disabled{
    background:#475569;
    cursor:not-allowed;
}

.loading{
    text-align:center;
    padding:50px 20px;
    color:#cbd5e1;
    font-size:18px;
}

.error-box{
    background:#450a0a;
    border:1px solid #ef4444;
    color:#fecaca;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.retry-btn{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#ef4444;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.empty-box{
    text-align:center;
    padding:50px 20px;
    background:#1e293b;
    border-radius:12px;
    color:#cbd5e1;
}

footer{
    text-align:center;
    padding:30px;
    margin-top:30px;
    color:#94a3b8;
}

@media(max-width:850px){
    .tournament-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){

    .menu-btn{
        display:block;
    }

    nav{
        display:none;
        position:absolute;
        top:60px;
        left:0;
        width:100%;
        background:#111827;
        flex-direction:column;
        padding:15px 20px;
    }

    nav.active{
        display:flex;
    }

    .tournament-grid{
        grid-template-columns:1fr;
    }

    .container{
        margin:20px auto;
        padding:15px;
    }

    .page-title{
        font-size:27px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">SB Tournament</div>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <nav id="navMenu">
        <a href="index.html">Home</a>
        <a href="registration.html">Registration</a>
        <a href="tournament.html">Tournaments</a>
        <a href="payment.html">Payment</a>
        <a href="support.html">Support</a>
    </nav>

</header>


<main class="container">

    <h1 class="page-title">Available Tournaments</h1>

    <p class="subtitle">
        Choose your tournament and register now.
    </p>

    <div id="tournamentGrid" class="tournament-grid">

        <div class="loading">
            Loading tournaments...
        </div>

    </div>

</main>


<footer>
    © 2026 SB Tournament. All rights reserved.
</footer>


<script>

/* ================================
   SUPABASE CONFIG
================================ */

const SUPABASE_URL =
"https://ofcpuiubovcjxucqynyw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NpG4P_VRdesJJkkzuBoanw_mbM3ivFS";

const TOURNAMENTS_TABLE = "tournaments";


/* ================================
   MOBILE MENU
================================ */

function toggleMenu(){

    const nav = document.getElementById("navMenu");

    nav.classList.toggle("active");
}


/* ================================
   SAFE TEXT
================================ */

function escapeHTML(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ================================
   FIND VALUE FROM DIFFERENT
   POSSIBLE COLUMN NAMES
================================ */

function getValue(row, names, fallback=""){

    for(const name of names){

        if(
            row[name] !== undefined &&
            row[name] !== null &&
            row[name] !== ""
        ){
            return row[name];
        }
    }

    return fallback;
}


/* ================================
   LOAD TOURNAMENTS
================================ */

async function loadTournaments(){

    const grid =
        document.getElementById("tournamentGrid");

    grid.innerHTML = `
        <div class="loading">
            Loading tournaments...
        </div>
    `;

    try{

        const endpoint =
            `${SUPABASE_URL}/rest/v1/${TOURNAMENTS_TABLE}?select=*`;

        const response = await fetch(endpoint,{

            method:"GET",

            headers:{
                "apikey":SUPABASE_KEY,
                "Authorization":`Bearer ${SUPABASE_KEY}`,
                "Content-Type":"application/json"
            }

        });


        if(!response.ok){

            let message =
                `Supabase error (${response.status})`;

            try{

                const errorData =
                    await response.json();

                if(errorData.message){
                    message = errorData.message;
                }

                if(errorData.hint){
                    message += ` - ${errorData.hint}`;
                }

            }catch(e){}

            throw new Error(message);
        }


        const tournaments =
            await response.json();


        if(!Array.isArray(tournaments)){

            throw new Error(
                "Invalid tournament data received."
            );
        }


        if(tournaments.length === 0){

            grid.innerHTML = `
                <div class="empty-box">
                    <h2>No tournaments available</h2>
                    <p style="margin-top:10px;">
                        Please check again later.
                    </p>
                </div>
            `;

            return;
        }


        grid.innerHTML = "";


        tournaments.forEach((tournament,index)=>{

            const card =
                createTournamentCard(
                    tournament,
                    index
                );

            grid.insertAdjacentHTML(
                "beforeend",
                card
            );

        });

    }

    catch(error){

        console.error(
            "Tournament loading error:",
            error
        );

        grid.innerHTML = `

            <div class="error-box">

                <h2>
                    Failed to load tournaments
                </h2>

                <p style="margin-top:10px;">
                    ${escapeHTML(error.message)}
                </p>

                <button
                    class="retry-btn"
                    onclick="loadTournaments()"
                >
                    Retry
                </button>

            </div>

        `;
    }
}


/* ================================
   CREATE TOURNAMENT CARD
================================ */

function createTournamentCard(row,index){

    const id =
        getValue(
            row,
            ["id","tournament_id"],
            index + 1
        );

    const title =
        getValue(
            row,
            [
                "title",
                "name",
                "tournament_name"
            ],
            "Free Fire Tournament"
        );

    const entryFee =
        getValue(
            row,
            [
                "entry_fee",
                "entryFee",
                "fee"
            ],
            "0"
        );

    const prizePool =
        getValue(
            row,
            [
                "prize_pool",
                "prizePool",
                "prize"
            ],
            "0"
        );

    const players =
        getValue(
            row,
            [
                "players",
                "max_players",
                "total_players",
                "slots"
            ],
            "0"
        );

    const mode =
        getValue(
            row,
            [
                "mode",
                "game_mode",
                "type"
            ],
            "Solo"
        );

    const status =
        getValue(
            row,
            [
                "status",
                "tournament_status"
            ],
            "Registration Open"
        );


    const icon =
        getValue(
            row,
            [
                "icon",
                "emoji"
            ],
            "🎮"
        );


    const statusText =
        String(status);


    const closed =
        [
            "closed",
            "full",
            "completed",
            "cancelled",
            "canceled"
        ].includes(
            statusText.toLowerCase()
        );


    let joinButton = "";

    if(closed){

        joinButton = `
            <button
                class="join-btn disabled"
                disabled
            >
                Registration Closed
            </button>
        `;

    }else{

        joinButton = `
            <a
                class="join-btn"
                href="registration.html?tournament_id=${encodeURIComponent(id)}"
            >
                Join Tournament
            </a>
        `;
    }


    return `

        <div class="tournament-card">

            <div class="icon">
                ${escapeHTML(icon)}
            </div>

            <h2>
                ${escapeHTML(title)}
            </h2>

            <div class="info">
                <span>Entry Fee</span>
                <strong>
                    ৳${escapeHTML(entryFee)}
                </strong>
            </div>

            <div class="info">
                <span>Prize Pool</span>
                <strong>
                    ৳${escapeHTML(prizePool)}
                </strong>
            </div>

            <div class="info">
                <span>Players</span>
                <strong>
                    ${escapeHTML(players)}
                </strong>
            </div>

            <div class="info">
                <span>Mode</span>
                <strong>
                    ${escapeHTML(mode)}
                </strong>
            </div>

            <div class="status ${closed ? "closed" : ""}">
                ${escapeHTML(statusText)}
            </div>

            ${joinButton}

        </div>

    `;
}


/* ================================
   START
================================ */

document.addEventListener(
    "DOMContentLoaded",
    loadTournaments
);

</script>

</body>
  </html>
