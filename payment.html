<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SB Tournament - Payment</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080d1c;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111a35;
      padding: 18px;
      text-align: center;
      border-bottom: 2px solid #00e5ff;
    }

    header h1 {
      color: #00e5ff;
      font-size: 25px;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: 30px auto;
    }

    .card {
      background: #111a35;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,229,255,0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #00e5ff;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #080d1c;
      color: white;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #00e5ff;
    }

    .payment-info {
      margin: 18px 0;
      padding: 15px;
      background: #080d1c;
      border-radius: 10px;
      border: 1px solid #334155;
    }

    .payment-info p {
      margin: 8px 0;
    }

    .number {
      color: #00e5ff;
      font-weight: bold;
      font-size: 18px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #00e5ff;
      color: #06101b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .success {
      display: block !important;
      background: #123d2a;
      color: #72f2ad;
    }

    .error {
      display: block !important;
      background: #451b24;
      color: #ff8e9d;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #00e5ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>SB TOURNAMENT</h1>
</header>

<div class="container">
  <div class="card">

    <h2>Payment</h2>

    <div class="payment-info">
      <p>bKash Number: <span class="number">01825265553</span></p>
      <p>Nagad Number: <span class="number">01703610065</span></p>
      <p>Send the required amount and enter your Transaction ID below.</p>
    </div>

    <form id="paymentForm">

      <label for="playerName">Player Name</label>
      <input
        type="text"
        id="playerName"
        placeholder="Enter your player name"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter phone number"
        required
      >

      <label for="method">Payment Method</label>
      <select id="method" required>
        <option value="">Select method</option>
        <option value="bkash">bKash</option>
        <option value="nagad">Nagad</option>
      </select>

      <label for="amount">Amount</label>
      <input
        type="number"
        id="amount"
        placeholder="Enter amount"
        min="1"
        step="0.01"
        required
      >

      <label for="transactionId">Transaction ID</label>
      <input
        type="text"
        id="transactionId"
        placeholder="Enter Transaction ID"
        required
      >

      <button type="submit" id="submitBtn">
        Submit Payment
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="index.html">← Back to Home</a>

  </div>
</div>

<script>
  // =========================================
  // SUPABASE CONFIG
  // =========================================

  const SUPABASE_URL =
    "https://khspwaoavafwoqvtyaux.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_NpG4P_VRdesJJkkzuBoanw_mbM3ivFS";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================================
  // PAYMENT FORM
  // =========================================

  const paymentForm = document.getElementById("paymentForm");
  const submitBtn = document.getElementById("submitBtn");
  const message = document.getElementById("message");


  paymentForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.className = "";
    message.style.display = "none";
    message.textContent = "";

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";


    const playerName =
      document.getElementById("playerName").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const method =
      document.getElementById("method").value;

    const amount =
      Number(document.getElementById("amount").value);

    const transactionId =
      document.getElementById("transactionId").value.trim();


    // Basic validation
    if (!playerName || !phone || !method ||
        !amount || amount <= 0 || !transactionId) {

      showMessage(
        "Please fill in all fields correctly.",
        "error"
      );

      resetButton();
      return;
    }


    try {

      const { data, error } =
        await supabaseClient
          .from("payments")
          .insert([
            {
              player_name: playerName,
              phone: phone,
              method: method,
              amount: amount,
              transaction_id: transactionId,
              status: "pending"
            }
          ])
          .select();


      if (error) {
        console.error("Supabase error:", error);
        throw error;
      }


      showMessage(
        "Payment submitted successfully! Your payment is pending approval.",
        "success"
      );

      paymentForm.reset();

    } catch (error) {

      console.error(error);

      showMessage(
        "Payment submission failed: " + error.message,
        "error"
      );

    } finally {
      resetButton();
    }

  });


  // =========================================
  // MESSAGE
  // =========================================

  function showMessage(text, type) {

    message.textContent = text;
    message.className = type;
    message.style.display = "block";
  }


  function resetButton() {

    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Payment";
  }

</script>

</body>
  </html>
