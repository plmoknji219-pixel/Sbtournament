<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard - SB Tournament</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
    }

    header {
      background: #111827;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      color: #38bdf8;
      font-size: 22px;
      font-weight: bold;
    }

    .menu-btn {
      display: none;
      font-size: 26px;
      cursor: pointer;
    }

    nav {
      display: flex;
      gap: 18px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
    }

    nav a:hover {
      color: #38bdf8;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .leaderboard {
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .table-head,
    .player-row {
      display: grid;
      grid-template-columns: 80px 1fr 120px 120px;
      align-items: center;
      padding: 16px 20px;
    }

    .table-head {
      background: #334155;
      font-weight: bold;
      color: #38bdf8;
    }

    .player-row {
      border-bottom: 1px solid #334155;
    }

    .player-row:last-child {
      border-bottom: none;
    }

    .rank {
      font-weight: bold;
      font-size: 18px;
    }

    .player-name {
      font-weight: bold;
    }

    .points {
      color: #38bdf8;
      font-weight: bold;
    }

    .wins {
      color: #86efac;
      font-weight: bold;
    }

    .top {
      background: #273449;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #94a3b8;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
    }

    @media (max-width: 700px) {
      .menu-btn {
        display: block;
      }

      nav {
        display: none;
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        background: #111827;
        flex-direction: column;
        padding: 15px 20px;
      }

      nav.active {
        display: flex;
      }

      .table-head,
      .player-row {
        grid-template-columns: 55px 1fr 75px 65px;
        padding: 14px 10px;
        font-size: 13px;
      }

      .container {
        padding: 12px;
        margin: 20px auto;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">SB Tournament</div>

  <div class="menu-btn" onclick="toggleMenu()">☰</div>

  <nav id="navMenu">
    <a href="index.html">Home</a>
    <a href="registration.html">Registration</a>
    <a href="tournament.html">Tournaments</a>
    <a href="payment.html">Payment</a>
    <a href="support.html">Support</a>
  </nav>
</header>

<main class="container">

  <h1>🏆 Leaderboard</h1>

  <p class="subtitle">
    Top players of SB Tournament
  </p>

  <div class="leaderboard">

    <div class="table-head">
      <div>Rank</div>
      <div>Player</div>
      <div>Points</div>
      <div>Wins</div>
    </div>

    <div id="leaderboardList">

      <div class="player-row top">
        <div class="rank">🥇 1</div>
        <div class="player-name">SB Player</div>
        <div class="points">100</div>
        <div class="wins">10</div>
      </div>

      <div class="player-row">
        <div class="rank">🥈 2</div>
        <div class="player-name">Pro Player</div>
        <div class="points">85</div>
        <div class="wins">8</div>
      </div>

      <div class="player-row">
        <div class="rank">🥉 3</div>
        <div class="player-name">Gaming King</div>
        <div class="points">72</div>
        <div class="wins">7</div>
      </div>

      <div class="player-row">
        <div class="rank">4</div>
        <div class="player-name">Tournament Pro</div>
        <div class="points">60</div>
        <div class="wins">6</div>
      </div>

      <div class="player-row">
        <div class="rank">5</div>
        <div class="player-name">FF Warrior</div>
        <div class="points">52</div>
        <div class="wins">5</div>
      </div>

    </div>

  </div>

</main>

<footer>
  © 2026 SB Tournament. All Rights Reserved.
</footer>

<script>
  function toggleMenu() {
    document.getElementById("navMenu").classList.toggle("active");
  }
</script>

</body>
  </html>
